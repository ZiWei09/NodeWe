[package]
name = "nodewe-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2.189"
ring = { version = "0.17.14", default-features = false, features = ["std"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"

[lib]
path = "src/lib.rs"

[[bin]]
name = "node-runtime"
path = "src/main.rs"
