[package]
name = "node-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
rusqlite = { version = "0.31.0", features = ["bundled"] }
postgres = "0.19.10"

[[bin]]
name = "node-control-plane"
path = "src/main.rs"
